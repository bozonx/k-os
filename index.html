<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="K-OS desktop application" />
    <title>K-OS</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <img src="/src/assets/tauri.svg" class="logo" alt="Tauri" />
      <h1>K-OS</h1>
      <p>Tauri 2 + Vite + TypeScript</p>

      <form class="row" id="greet-form">
        <label class="sr-only" for="greet-input">Имя</label>
        <input id="greet-input" name="name" placeholder="Введите имя" autocomplete="name" />
        <button type="submit">Поздороваться</button>
      </form>
      <p id="greet-msg"></p>
    </main>
  </body>
</html>
